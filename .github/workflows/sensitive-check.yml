name: Sensitive Data Check

on:
  workflow_dispatch:
  push:
    branches: [Main, mattboxx]
  pull_request:
    branches: [Main, mattboxx]

permissions:
  contents: read

jobs:
  scan:
    name: Scan content, firmware and Git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Pinned ESP-IDF 5.5.3 lwIP for real packet-path regressions
        uses: actions/checkout@v7
        with:
          repository: espressif/esp-lwip
          ref: fd432e4ee2cfb7f7f1c7eb7227e0173412e7b84e
          path: .test-deps/esp-lwip
          persist-credentials: false
      - name: Install scanner dependency
        run: |
          python3 -m pip install PyYAML==6.0.2
          sudo apt-get update
          sudo apt-get install -y libcjson-dev
      - name: Pinned ESP-IDF 5.5.3 MQTT task ownership regressions
        uses: actions/checkout@v7
        with:
          repository: espressif/esp-mqtt
          ref: 6af4446a48ea7fa54948edc4e62277ed70abb6e1
          path: .test-deps/esp-mqtt
          persist-credentials: false
      - name: Espressif mbedTLS 3.6.5 for first-boot setup crypto regressions (AES-GCM/SHA-256 only)
        uses: actions/checkout@v7
        with:
          repository: espressif/mbedtls
          ref: c3db4124ce35e6a698019bd62a281f16ddb677a6
          path: .test-deps/mbedtls
          persist-credentials: false
      - name: Independent client crypto for first-boot setup regressions
        run: python3 -m pip install cryptography==44.0.2
      - name: Pinned ESP-IDF 5.5.3 partition generator for migration regressions
        uses: actions/checkout@v7
        with:
          repository: espressif/esp-idf
          ref: 2c211b236707889e8400c4dc5644dd5c4ee071e0
          sparse-checkout: components/partition_table
          path: .test-deps/esp-idf
          persist-credentials: false
      - name: Consolidated offline validation
        run: PARTITION_TABLE_SOURCE=.test-deps/esp-idf/components/partition_table/gen_esp32part.py LWIP_SOURCE=.test-deps/esp-lwip MQTT_SOURCE=.test-deps/esp-mqtt/mqtt_client.c MBEDTLS_DIR=.test-deps/mbedtls python3 tools/validate_all.py --sanitizers
