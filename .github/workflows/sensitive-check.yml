name: Sensitive Data Check

on:
  workflow_dispatch:
  push:
    branches: [Main, mattboxx]
  pull_request:
    branches: [Main, mattboxx]

permissions:
  contents: read

jobs:
  scan:
    name: Scan content, firmware and Git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Install scanner dependency
        run: |
          python3 -m pip install PyYAML==6.0.2
          sudo apt-get update
          sudo apt-get install -y libcjson-dev
      - name: Regression tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror tools/test_control_validation.c -o /tmp/control-tests
          /tmp/control-tests
          gcc -std=c11 -Wall -Wextra -Werror tools/test_upstream_validation.c -o /tmp/upstream-tests
          /tmp/upstream-tests
          python3 -m unittest discover -s tools -p 'test_sensitive_scanner.py'
          python3 -m unittest discover -s tools -p 'test_upstream_integration.py'
          python3 tools/test_feature_preservation.py
          python3 tools/test_ntfy_stack.py
          NTFY_SANITIZE=1 python3 tools/test_ntfy_logic.py
          NTFY_SANITIZE=1 python3 tools/test_ntfy_transport.py
          NTFY_SANITIZE=1 python3 tools/test_ntfy_stream.py
          SNMP_SANITIZE=1 python3 tools/test_snmp_codec.py
          ROUTE_SANITIZE=1 python3 tools/test_route_hook.py
          NETIF_SANITIZE=1 python3 tools/test_netif_hooks.py
          PORTMAP_SANITIZE=1 python3 tools/test_portmap.py
          FORWARDING_SANITIZE=1 python3 tools/test_forwarding_transactions.py
          TAILNET_SANITIZE=1 python3 tools/test_tailnet_filter.py
          TAILNET_SANITIZE=1 python3 tools/test_tailnet_state.py
          TAILNET_SANITIZE=1 python3 tools/test_tailnet_api.py
          TAILNET_SANITIZE=1 python3 tools/test_tailnet_core.py
          PEER_DNS_SANITIZE=1 python3 tools/test_peer_dns.py
          OTA_SANITIZE=1 python3 tools/test_ota_remote.py
      - name: Check sensitive data without logging secret values
        run: |
          python3 tools/check_sensitive_data.py --history
          python3 tools/check_sensitive_data.py --repository external/microlink
