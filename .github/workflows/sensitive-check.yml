name: Sensitive Data Check

on:
  workflow_dispatch:
  push:
    branches: [Main, mattboxx]
  pull_request:
    branches: [Main, mattboxx]

permissions:
  contents: read

jobs:
  scan:
    name: Scan content, firmware and Git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Pinned ESP-IDF 5.5.6 lwIP for real packet-path regressions
        uses: actions/checkout@v7
        with:
          repository: espressif/esp-lwip
          ref: c6f2f878e7b0f86033214b85547d579be43351e3
          path: .test-deps/esp-lwip
          persist-credentials: false
      - name: Install scanner dependency
        run: |
          python3 -m pip install PyYAML==6.0.2
          sudo apt-get update
          sudo apt-get install -y libcjson-dev
      - name: Pinned ESP-IDF 5.5.6 MQTT task ownership regressions
        uses: actions/checkout@v7
        with:
          repository: espressif/esp-mqtt
          ref: 0e9ec171b448db2101ea537300976b7ffe595941
          path: .test-deps/esp-mqtt
          persist-credentials: false
      - name: Espressif mbedTLS for first-boot setup crypto regressions (AES-GCM/SHA-256 only)
        uses: actions/checkout@v7
        with:
          repository: espressif/mbedtls
          ref: 2b96dd8eebe880f304c69976b3c2fa0c5100cbb6
          path: .test-deps/mbedtls
          persist-credentials: false
      - name: Independent client crypto for first-boot setup regressions
        run: python3 -m pip install cryptography==44.0.2
      - name: Pinned ESP-IDF 5.5.6 partition generator for migration regressions
        uses: actions/checkout@v7
        with:
          repository: espressif/esp-idf
          ref: 880a203ae603d08a94d06aa01e0d6761958e5e9e
          sparse-checkout: |
            components/partition_table
            components/mbedtls/esp_crt_bundle
          path: .test-deps/esp-idf
          persist-credentials: false
      - name: Consolidated offline validation
        run: PARTITION_TABLE_SOURCE=.test-deps/esp-idf/components/partition_table/gen_esp32part.py CRT_BUNDLE=.test-deps/esp-idf/components/mbedtls/esp_crt_bundle/cacrt_all.pem LWIP_SOURCE=.test-deps/esp-lwip MQTT_SOURCE=.test-deps/esp-mqtt/mqtt_client.c MBEDTLS_DIR=.test-deps/mbedtls python3 tools/validate_all.py --sanitizers
