; PlatformIO build configuration.
;
; The canonical target is esp32-s3 with octal PSRAM (N16R8 reference
; board). Other variants are kept around so the codebase doesn't drift
; into S3-only surprises, but they are not regression-tested.

[platformio]
default_envs = esp32-s3
; PlatformIO defaults to looking for project sources in src/, but ESP-IDF
; expects them in main/. Tell PIO to look there.
src_dir = main

[env]
framework = espidf
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -Wall
  -Wno-unused-function

[env:esp32-s3]
; Pin the SDK used for the release: IDF 5.5.3 supports the upstream
; 26-socket budget; older cached platforms silently capped this at 16.
platform = espressif32@6.13.0
; Board def: the pinned espressif32 platform ships no "DevKitC-1 N16R8"
; board, and with framework=espidf the board def only bootstraps the
; toolchain target and flash/upload defaults anyway — all real hardware
; configuration lives in sdkconfig, and this project has no
; board-specific GPIO mapping. esp32s3box is simply the stock S3 def
; whose 16 MB flash + 8 MB octal PSRAM matches the N16R8 reference
; module; the hardware is NOT an ESP32-S3-Box. (Asked in issue #9.)
board = esp32s3box
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_upload.flash_size = 8MB
; Pre-build hooks:
;  - regen_embed.py forces a CMake reconfigure when main/index.html is
;    newer than main/index_html_data.c. Without this PIO caches the
;    configure step and the device serves a stale SPA blob.
;  - force_rebuild_app_desc.py removes the cached esp_app_desc.c object
;    so __DATE__/__TIME__ inside esp_app_desc_t refresh on every build.
;    The web UI displays that build timestamp; without the hook it freezes
;    at the cold-build time across later incremental rebuilds.
extra_scripts =
  pre:tools/regen_embed.py
  pre:tools/force_rebuild_app_desc.py

; Optional build for boards with an explicitly wired W5500 SPI Ethernet module.
; Same source and identity; only adds the driver (about 61 KiB of app flash).
; The default esp32-s3 image stays WiFi-only and reports Ethernet not compiled.
; 3.0: a single image (every Web UI language, Ethernet driver) for
; ESP32-S3 N8R8 and N16R8; no separate Ethernet or language environments.

; 2.1 migration bridge for 2.x gateways (2.x 4 MB layout, English only, no
; Ethernet/cellular driver). Build esp32-s3 first: tools/bridge_sdkconfig.py
; derives its configuration from sdkconfig.esp32-s3.
[env:esp32-s3-bridge]
extends = env:esp32-s3
board_upload.flash_size = 4MB
board_build.partitions = partitions-2x.csv
extra_scripts =
  pre:tools/bridge_sdkconfig.py
  pre:tools/regen_embed.py
  pre:tools/force_rebuild_app_desc.py
