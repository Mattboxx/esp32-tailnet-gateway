<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">Subnet routing: Tailnet to LAN</title>
  <desc id="d">Tailnet clients reach devices on the ESP32's networks through an advertised and admin-approved subnet route. Optional source NAT lets LAN hosts reply without a static route on the main router.</desc>
  <style>
    text{font-family:Inter,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#E6EDF3}
    .h{font-size:15px;font-weight:650}.s{font-size:12.5px;fill:#8B949E}.z{font-size:11.5px;font-weight:600;letter-spacing:2px;fill:#8B949E}
    .zone{fill:#11161D;stroke:#30363D}.box{fill:#161B22;stroke:#30363D}.hot{fill:#0F2624;stroke:#2DD4BF;stroke-width:1.5}
    .ln{stroke:#E6EDF3;stroke-width:2;fill:none}.wg{stroke:#2DD4BF;stroke-width:2.5;fill:none;stroke-dasharray:7 5}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E6EDF3"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2DD4BF"/></marker>
  </defs>
  <rect width="960" height="360" rx="16" fill="#0D1117"/>
  <rect class="zone" x="20" y="44" width="280" height="264" rx="12"/>
  <rect class="zone" x="340" y="44" width="280" height="264" rx="12"/>
  <rect class="zone" x="660" y="44" width="280" height="264" rx="12"/>
  <text class="z" x="36" y="70">TAILNET, ANYWHERE</text>
  <text class="z" x="356" y="70">ESP32-S3 SUBNET ROUTER</text>
  <text class="z" x="676" y="70">SITE LAN</text>

  <rect class="box" x="40" y="96" width="240" height="64" rx="10"/>
  <text class="h" x="56" y="122">Phone or laptop</text>
  <text class="s" x="56" y="144">Tailscale client, accepts routes</text>
  <rect class="box" x="40" y="180" width="240" height="64" rx="10"/>
  <text class="h" x="56" y="206">Home Assistant</text>
  <text class="s" x="56" y="228">another tailnet node</text>

  <rect class="hot" x="360" y="96" width="240" height="192" rx="12"/>
  <text class="h" x="376" y="124">Advertises 192.168.1.0/24</text>
  <text class="s" x="376" y="150">approved in the admin console</text>
  <text class="s" x="376" y="176">Tailnet authorization checked on</text>
  <text class="s" x="376" y="196">original packets, before NAT</text>
  <text class="s" x="376" y="222">optional source NAT: replies</text>
  <text class="s" x="376" y="242">return without a static route</text>
  <text class="s" x="376" y="268">firewall chains and counters</text>

  <rect class="box" x="680" y="96" width="240" height="56" rx="10"/>
  <text class="h" x="696" y="129">NAS web UI</text>
  <rect class="box" x="680" y="164" width="240" height="56" rx="10"/>
  <text class="h" x="696" y="197">Printer, camera, PLC</text>
  <rect class="box" x="680" y="232" width="240" height="56" rx="10"/>
  <text class="h" x="696" y="265">Sensors, switches</text>

  <path class="wg" d="M280 128H356" marker-end="url(#at)"/>
  <path class="wg" d="M280 212H356" marker-end="url(#at)"/>
  <path class="ln" d="M600 124H676" marker-end="url(#a)"/>
  <path class="ln" d="M600 192H676" marker-end="url(#a)"/>
  <path class="ln" d="M600 260H676" marker-end="url(#a)"/>

  <text class="s" x="20" y="338">Direction is Tailnet → LAN (the reverse of the Service Gateway). Routes need admin approval; the ESP32's own AP subnet can be advertised too.</text>
</svg>
