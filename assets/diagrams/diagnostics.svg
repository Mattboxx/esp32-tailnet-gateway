<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d">
  <title id="t">Evidence-based diagnostics</title>
  <desc id="d">Each layer is reported as separate evidence: control connection, peer path, installed rule, destination TCP handshake, accepted packets and admitted replies, and the periodic Service watch. Results are shown in the Web UI and export, and optionally via MQTT and Home Assistant, ntfy, SNMP and the microSD log.</desc>
  <style>
    text{font-family:Inter,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#E6EDF3}
    .h{font-size:14px;font-weight:650}.s{font-size:12.5px;fill:#8B949E}.z{font-size:11.5px;font-weight:600;letter-spacing:2px;fill:#8B949E}
    .t{fill:#2DD4BF}
    .zone{fill:#11161D;stroke:#30363D}.box{fill:#161B22;stroke:#30363D}.hot{fill:#0F2624;stroke:#2DD4BF;stroke-width:1.5}
    .ln{stroke:#475569;stroke-width:2;fill:none}
  </style>
  <rect width="960" height="380" rx="16" fill="#0D1117"/>
  <rect class="zone" x="20" y="44" width="620" height="290" rx="12"/>
  <rect class="zone" x="660" y="44" width="280" height="290" rx="12"/>
  <text class="z" x="36" y="70">EVIDENCE LADDER — EACH STEP PROVES ONLY ITSELF</text>
  <text class="z" x="676" y="70">WHERE YOU SEE IT</text>

  <g>
    <rect class="box" x="40" y="88" width="580" height="34" rx="8"/>
    <text class="h" x="56" y="110">Control connected</text><text class="s" x="300" y="110">coordination server reachable, map received</text>
    <rect class="box" x="40" y="128" width="580" height="34" rx="8"/>
    <text class="h" x="56" y="150">Peer path</text><text class="s" x="300" y="150">direct or DERP relay, last handshake</text>
    <rect class="box" x="40" y="168" width="580" height="34" rx="8"/>
    <text class="h" x="56" y="190">Rule installed</text><text class="s" x="300" y="190">local listener and mapping exist</text>
    <rect class="hot" x="40" y="208" width="580" height="34" rx="8"/>
    <text class="h" x="56" y="230">Destination test</text><text class="s" x="300" y="230">one bounded TCP handshake from the ESP32</text>
    <rect class="box" x="40" y="248" width="580" height="34" rx="8"/>
    <text class="h" x="56" y="270">Traffic evidence</text><text class="s" x="300" y="270">accepted / rejected packets, admitted replies</text>
    <rect class="box" x="40" y="288" width="580" height="34" rx="8"/>
    <text class="h" x="56" y="310">Service watch</text><text class="s" x="300" y="310">periodic opt-in checks with change alerts</text>
  </g>

  <g>
    <text class="s" x="680" y="104"><tspan class="t">●</tspan>  Web UI status and per-rule card</text>
    <text class="s" x="680" y="132"><tspan class="t">●</tspan>  Route explain, ping, traceroute</text>
    <text class="s" x="680" y="160"><tspan class="t">●</tspan>  Sanitized diagnostic export</text>
    <text class="s" x="680" y="188"><tspan class="t">○</tspan>  MQTT / Home Assistant (optional)</text>
    <text class="s" x="680" y="216"><tspan class="t">○</tspan>  ntfy notifications (optional)</text>
    <text class="s" x="680" y="244"><tspan class="t">○</tspan>  SNMP v1/v2c read-only (optional)</text>
    <text class="s" x="680" y="272"><tspan class="t">○</tspan>  microSD flight recorder (optional)</text>
    <text class="s" x="680" y="312">● built in   ○ off until you enable it</text>
  </g>
  <text class="s" x="20" y="362">Missing observations stay "unknown", never "healthy". UDP cannot be verified without an application reply.</text>
</svg>
