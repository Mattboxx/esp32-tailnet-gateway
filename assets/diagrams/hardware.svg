<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">Supported hardware</title>
  <desc id="d">Reference target: an ESP32-S3 board with 16 MB flash and 8 MB octal PSRAM, powered over USB-C independently from the machines it recovers. Optional microSD card for the log recorder. Optional W5500 SPI Ethernet module only with the separate Ethernet build, which is experimental and not hardware-validated.</desc>
  <style>
    text{font-family:Inter,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#E3ECE6}
    .h{font-size:15px;font-weight:650}.s{font-size:12.5px;fill:#8DA397}.z{font-size:11.5px;font-weight:600;letter-spacing:2px;fill:#8DA397}
    .t{fill:#1FC97A}.am{fill:#F5A524}
    .box{fill:#111814;stroke:#1C2A22}.opt{fill:#111814;stroke:#2E4A3B;stroke-dasharray:5 4}
  </style>
  <rect width="960" height="360" rx="16" fill="#0A0F0C"/>
  <g>
    <rect x="60" y="70" width="300" height="190" rx="14" fill="#0E1511" stroke="#1C2A22"/>
    <rect x="96" y="104" width="128" height="104" rx="8" fill="#16201A" stroke="#2E4A3B"/>
    <rect x="116" y="124" width="88" height="64" rx="4" fill="#0A0F0C" stroke="#1FC97A" stroke-width="1.5"/>
    <text class="s" x="160" y="161" text-anchor="middle">ESP32-S3</text>
    <rect x="244" y="104" width="88" height="40" rx="6" fill="#16201A" stroke="#2E4A3B"/>
    <text class="s" x="288" y="129" text-anchor="middle">PSRAM</text>
    <rect x="244" y="160" width="88" height="40" rx="6" fill="#16201A" stroke="#2E4A3B"/>
    <text class="s" x="288" y="185" text-anchor="middle">Flash</text>
    <rect x="34" y="150" width="34" height="30" rx="6" fill="#1C2A22"/>
    <text class="s" x="51" y="200" text-anchor="middle">USB-C</text>
    <path d="M78 84h284M78 246h284" stroke="#1C2A22" stroke-dasharray="2 6" stroke-width="3"/>
  </g>
  <text class="h" x="60" y="292">Reference: ESP32-S3 N16R8</text>
  <text class="s" x="60" y="314">16 MB flash · 8 MB octal PSRAM · 2.4 GHz WiFi</text>

  <rect class="box" x="420" y="60" width="500" height="72" rx="10"/>
  <text class="h" x="440" y="88">Power</text>
  <text class="s" x="440" y="112">Reliable USB supply, separate from the NAS or PC it should wake</text>
  <rect class="opt" x="420" y="144" width="500" height="72" rx="10"/>
  <text class="h" x="440" y="172">microSD (optional)</text>
  <text class="s" x="440" y="196">Flight recorder for logs; the firmware runs without it</text>
  <rect class="opt" x="420" y="228" width="500" height="88" rx="10"/>
  <text class="h" x="440" y="256">W5500 SPI Ethernet (optional, separate build)</text>
  <text class="s" x="440" y="280">Explicitly wired module, esp32-s3-eth image only</text>
  <text class="s am" x="440" y="302">Experimental: host-tested, not hardware-validated</text>
  <text class="z" x="60" y="44">HARDWARE</text>
</svg>
