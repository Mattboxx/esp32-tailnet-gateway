<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">ESP32 Tailnet Gateway — Mattboxx Edition</title>
  <desc id="d">One ESP32. Multiple Tailnet roles. Enable only what you need. A LAN device passes through the ESP32; the Service Gateway role is lit while subnet router, AP gateway, exit node and remote recovery stay off until enabled.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="#0D1117"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <g transform="translate(80 84) scale(1.5)">
    <rect width="64" height="64" rx="14" fill="#161B22" stroke="#30363D"/>
    <g fill="none" stroke-linecap="round" stroke-width="3.5">
      <path d="M15 32h10" stroke="#E6EDF3"/>
      <path d="M38 32h10" stroke="#2DD4BF"/>
      <path d="M38 28.5c5 0 5-10.5 10.5-10.5" stroke="#475569"/>
      <path d="M38 35.5c5 0 5 10.5 10.5 10.5" stroke="#475569"/>
    </g>
    <circle cx="12.5" cy="32" r="4.5" fill="#E6EDF3"/>
    <rect x="25" y="20" width="13" height="24" rx="4" fill="#2DD4BF"/>
    <rect x="29.5" y="26" width="4" height="12" rx="2" fill="#161B22"/>
    <circle cx="52" cy="32" r="4.5" fill="#2DD4BF"/>
    <circle cx="52" cy="18" r="3.5" fill="none" stroke="#475569" stroke-width="2.5"/>
    <circle cx="52" cy="46" r="3.5" fill="none" stroke="#475569" stroke-width="2.5"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="200" y="134" font-size="50" font-weight="650" fill="#E6EDF3">ESP32 Tailnet Gateway</text>
    <text x="203" y="170" font-size="16" font-weight="600" letter-spacing="4" fill="#2DD4BF">MATTBOXX EDITION</text>
    <text x="80" y="268" font-size="28" font-weight="500" fill="#C9D1D9">One ESP32. Multiple Tailnet roles.</text>
    <text x="80" y="308" font-size="28" font-weight="500" fill="#2DD4BF">Enable only what you need.</text>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8B949E" text-anchor="middle">
    <rect x="752" y="180" width="56" height="40" rx="8" fill="#161B22" stroke="#E6EDF3" stroke-width="2.5"/>
    <path d="M768 228h24" stroke="#E6EDF3" stroke-width="2.5" stroke-linecap="round"/>
    <text x="780" y="256">LAN device</text>
    <path d="M808 200h64" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round"/>
    <rect x="872" y="160" width="36" height="80" rx="10" fill="#2DD4BF"/>
    <rect x="885" y="182" width="10" height="36" rx="5" fill="#0D1117"/>
    <text x="890" y="266">ESP32-S3</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M908 184c56 0 56-74 112-74" stroke="#475569"/>
    <path d="M908 192c56 0 56-37 112-37" stroke="#475569"/>
    <path d="M908 200h112" stroke="#2DD4BF"/>
    <path d="M908 208c56 0 56 37 112 37" stroke="#475569"/>
    <path d="M908 216c56 0 56 74 112 74" stroke="#475569"/>
  </g>
  <g>
    <circle cx="1030" cy="110" r="7" fill="#0D1117" stroke="#475569" stroke-width="2.5"/>
    <circle cx="1030" cy="155" r="7" fill="#0D1117" stroke="#475569" stroke-width="2.5"/>
    <circle cx="1030" cy="200" r="8" fill="#2DD4BF"/>
    <circle cx="1030" cy="245" r="7" fill="#0D1117" stroke="#475569" stroke-width="2.5"/>
    <circle cx="1030" cy="290" r="7" fill="#0D1117" stroke="#475569" stroke-width="2.5"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18">
    <text x="1050" y="116" fill="#8B949E">Subnet router</text>
    <text x="1050" y="161" fill="#8B949E">AP gateway</text>
    <text x="1050" y="206" fill="#E6EDF3" font-weight="650">Service Gateway</text>
    <text x="1050" y="251" fill="#8B949E">Exit node</text>
    <text x="1050" y="296" fill="#8B949E">Remote recovery</text>
  </g>
