<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d"><title id="t">ESP32 Tailnet Gateway — Mattboxx Edition</title><desc id="d">One ESP32. Multiple Tailnet roles. Enable only what you need. A LAN device passes through the ESP32; the Service Gateway role is lit while subnet router, AP gateway, exit node and remote recovery stay off until enabled.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0F1612" stroke-width="1"/></pattern></defs><rect width="1280" height="400" fill="#0A0F0C"/><rect width="1280" height="400" fill="url(#grid)"/><g transform="translate(80 84) scale(1.5)"><rect width="64" height="64" rx="15" fill="#111814" stroke="#1C2A22"/><g fill="none" stroke-linecap="round" stroke-width="4.5"><path d="M10 32h17" stroke="#1FC97A"/><path d="M27 32c11 0 11-15 21-15M27 32c11 0 11 15 21 15" stroke="#1F5C3F"/><path d="M27 32h21" stroke="#1FC97A"/></g><circle cx="27" cy="32" r="8" fill="#1FC97A"/><circle cx="27" cy="32" r="3" fill="#111814"/><circle cx="52" cy="32" r="5.5" fill="#1FC97A"/><circle cx="51.5" cy="17" r="3.5" fill="none" stroke="#1F5C3F" stroke-width="2.6"/><circle cx="51.5" cy="47" r="3.5" fill="none" stroke="#1F5C3F" stroke-width="2.6"/></g><g font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><text x="200" y="134" font-size="50" font-weight="650" letter-spacing="-0.6" fill="#1FC97A">ESP32 Tailnet Gateway</text><text x="203" y="170" font-size="15" font-weight="650" letter-spacing="4" fill="#5E9C7D">MATTBOXX EDITION</text><text x="80" y="268" font-size="28" font-weight="500" fill="#9FDCBE">One ESP32. Multiple Tailnet roles.</text><text x="80" y="308" font-size="28" font-weight="600" fill="#1FC97A">Enable only what you need.</text></g><rect x="740" y="178" width="60" height="44" rx="9" fill="none" stroke="#1FC97A" stroke-width="2.5"/><path d="M758 230h24" stroke="#1FC97A" stroke-width="2.5" stroke-linecap="round"/><text x="770" y="258" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#5E9C7D">LAN device</text><path d="M800 200H890" stroke="#1FC97A" stroke-width="3" stroke-linecap="round"/><g fill="none" stroke-linecap="round" stroke-width="3"><path d="M890 200C960 200 960 100 1030 100" stroke="#1F5C3F"/><path d="M890 200C960 200 960 150 1030 150" stroke="#1F5C3F"/><path d="M890 200H1030" stroke="#1FC97A"/><path d="M890 200C960 200 960 250 1030 250" stroke="#1F5C3F"/><path d="M890 200C960 200 960 300 1030 300" stroke="#1F5C3F"/></g><circle cx="890" cy="200" r="18" fill="#1FC97A"/><circle cx="890" cy="200" r="7" fill="#0A0F0C"/><text x="890" y="248" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#5E9C7D">ESP32-S3</text><circle cx="1040" cy="100" r="7" fill="none" stroke="#1F5C3F" stroke-width="2.5"/><text x="1060" y="107" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#5E9C7D">Subnet router</text><circle cx="1040" cy="150" r="7" fill="none" stroke="#1F5C3F" stroke-width="2.5"/><text x="1060" y="157" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#5E9C7D">AP gateway</text><circle cx="1040" cy="200" r="9" fill="#1FC97A"/><text x="1060" y="207" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="650" fill="#1FC97A">Service Gateway</text><circle cx="1040" cy="250" r="7" fill="none" stroke="#1F5C3F" stroke-width="2.5"/><text x="1060" y="257" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#5E9C7D">Exit node</text><circle cx="1040" cy="300" r="7" fill="none" stroke="#1F5C3F" stroke-width="2.5"/><text x="1060" y="307" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill=