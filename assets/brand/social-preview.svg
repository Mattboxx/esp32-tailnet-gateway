    <text x="96" y="318" font-size="32" font-weight="500" fill="#C9D1D9">One ESP32.</text>
    <text x="96" y="362" font-size="32" font-weight="500" fill="#C9D1D9">Multiple Tailnet roles.</text>
    <text x="96" y="406" font-size="32" font-weight="500" fill="#2DD4BF">Enable only what you need.</text>
  </g>
