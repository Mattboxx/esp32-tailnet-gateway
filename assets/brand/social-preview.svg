<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">ESP32 Tailnet Gateway — Mattboxx Edition</title>
  <desc id="d">All-in-one ESP32-S3 Tailscale/Headscale gateway with selective LAN-to-Tailnet access, subnet routing, remote recovery and optional automation.</desc>
  <defs>
